# The only thing reachable from outside the VM. Traefik is whatever k3s shipped: the Ingress here is a
# plain manifest, and which controller implements it is the distro's business, not this repo's (D40).
#
# The hostname is game-rec.duckdns.org, on DuckDNS, pointed at the VM (D46). Change it in one place
# if the host ever moves -- an Ingress for a name that resolves elsewhere matches on a Host header
# that never arrives, which looks deployed and answers nothing:
#
#   sed -i 's/game-rec.duckdns.org/<your host>/' deploy/k8s/50-ingress.yaml
#
# TLS terminates here against a Secret this repo does not create; deploy/vm/README.md has the certbot
# loop that fills it. Without that Secret Traefik serves its own self-signed certificate, which is a
# browser warning rather than an outage, so the tls block stays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamerec
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
  annotations:
    # This router answers on 443 only. Plain HTTP is handled by the second Ingress below, which
    # redirects to here rather than serving anything: the API is read-only and the corpus is public
    # Steam data, so this is about not training anyone to ignore the scheme, not about secrecy.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - game-rec.duckdns.org
      secretName: gamerec-tls
  rules:
    - host: game-rec.duckdns.org
      http:
        paths:
          # Everything, including /livez and /readyz. They are not secrets and being able to ask the
          # service whether it thinks it is ready, from outside, is worth more than hiding them.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamerec-api
                port:
                  number: 8000
---
# Port 80, which until now had no router at all: `curl http://game-rec.duckdns.org/livez` returned
# Traefik's own 404 while the annotation above claimed a redirect (D54). Now it is a 308 to https.
#
# Two Ingresses and not one with both entrypoints. A single router carrying the redirect on 443 as
# well would be answering requests that are already https, and whether that is a no-op or a loop
# depends on how the middleware compares the rewritten URL to the original -- which is not something
# to find out from the outside, on a host people are using. Separate routers cannot loop: this one
# only ever sees port 80.
#
# The Middleware is a Traefik CRD, so this is the one file in the deploy that names its Ingress
# controller. k3s ships Traefik and its CRDs, so it adds an object rather than a dependency (D54).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
spec:
  redirectScheme:
    scheme: https
    # 308 rather than 301: it keeps the method and the body, so a redirected request stays the same
    # request. Nothing here is a POST today, and a permanent redirect that quietly turns one into a GET
    # is not a thing to leave lying around for whoever adds the first one.
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamerec-http
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
  annotations:
    # <namespace>-<name>@kubernetescrd is Traefik's addressing for a Middleware, not a Kubernetes
    # convention, and it is silently ignored if it does not resolve -- which looks exactly like this
    # working, except for the 404.
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gamerec-https-redirect@kubernetescrd
spec:
  # No tls block: that is the point of this one.
  rules:
    - host: game-rec.duckdns.org
      http:
        paths:
          # A backend is required by the Ingress schema and is never reached -- the middleware answers
          # every request here before routing. It points at the real Service so that a redirect that
          # somehow does not fire serves the API rather than a 503.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamerec-api
                port:
                  number: 8000
