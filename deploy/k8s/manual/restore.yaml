# Restore the newest complete Backup Generation over MinDB's volume (ADR-0002).
#
# MinDB must be stopped first. It reads the snapshot once at boot and writes its own over the top at
# -snapshot-interval, so restoring beside a running MinDB either has no effect or is undone within
# the minute:
#
#   kubectl -n gamerec scale deploy/mindb --replicas=0
#   kubectl -n gamerec delete job/gamerec-restore --ignore-not-found
#   kubectl -n gamerec apply -f deploy/k8s/manual/restore.yaml
#   kubectl -n gamerec logs -f job/gamerec-restore
#   kubectl -n gamerec scale deploy/mindb --replicas=1
#
# To see what is restorable without touching anything, ask the backup sidecar -- same image, same
# credentials, and it is already running:
#
#   kubectl -n gamerec exec deploy/mindb -c backup -- python -m ops.restore --list
#
# --force is passed because the volume normally already holds a snapshot -- that is the usual reason
# to be restoring. The checkpoint is written before the snapshot, so a Job killed halfway leaves a
# checkpoint with no snapshot, which reads as "nothing is loaded" and is recoverable; the reverse
# would read as "everything is ingested" and would not be.
apiVersion: batch/v1
kind: Job
metadata:
  name: gamerec-restore
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
    app.kubernetes.io/component: restore
spec:
  backoffLimit: 0  # A restore that failed verification will fail the same way on a retry.
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: gamerec
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # 65532, not 10001: these files are MinDB's, and it writes them 0600. Restoring them as
        # anything else leaves a snapshot MinDB cannot read.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: ghcr.io/deviousdrops/gamerec-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ops.restore"]
          args: ["--snapshot=/data/mindb.snap", "--force"]
          envFrom:
            - configMapRef:
                name: gamerec-config
            - secretRef:
                name: gamerec-secrets
                optional: true
          resources:
            requests:
              memory: 450Mi
              cpu: 100m
            limits:
              memory: 700Mi
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # Writable: the restored checkpoint has to land beside the snapshot it describes, or the
            # next ingest resumes from a checkpoint that disagrees with the vectors.
            - name: corpus
              mountPath: /corpus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mindb-data
        - name: corpus
          persistentVolumeClaim:
            claimName: corpus
        - name: tmp
          emptyDir: {}
