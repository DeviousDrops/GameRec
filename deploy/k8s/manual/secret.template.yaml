# The tracked example. The real Secret is never committed (requirement 6) -- create it directly, and
# in a form that keeps the values out of argv, out of `ps` and out of shell history:
#
#   read -rsp "Groq API key: " GROQ_KEY; echo          # -s: nothing is echoed as you type
#   read -rsp "R2 access key id: " R2_ID; echo
#   read -rsp "R2 secret access key: " R2_SECRET; echo
#   printf '%s\n' "GROQ_API_KEY=$GROQ_KEY" "R2_ACCESS_KEY_ID=$R2_ID" \
#     "R2_SECRET_ACCESS_KEY=$R2_SECRET" \
#     "R2_ENDPOINT=https://<account>.r2.cloudflarestorage.com" \
#     | kubectl -n gamerec create secret generic gamerec-secrets --from-env-file=/dev/stdin
#   unset GROQ_KEY R2_ID R2_SECRET
#
# Changing a value later needs `kubectl -n gamerec rollout restart deploy/mindb deploy/gamerec-api`:
# envFrom is read once, when the container starts, so a corrected credential reaches nothing until the
# consumers are replaced. The CronJob needs nothing -- its next run is a new pod.
#
# It lives in manual/ so that `kubectl apply -f deploy/k8s/` cannot overwrite a real key with this
# empty one. Everything referencing it marks it optional: without a key the service answers
# normally, it just does not narrate (D6).
apiVersion: v1
kind: Secret
metadata:
  name: gamerec-secrets
  namespace: gamerec
type: Opaque
stringData:
  GROQ_API_KEY: ""
  # An R2 token scoped to the one bucket. It is the ingest lease and the backups, so the blast radius
  # of losing it is "no backups and possibly two ingests", not "someone reads the corpus" -- the
  # corpus is public Steam data. Scope it to the bucket anyway.
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  # Not a credential, but it belongs here rather than in the ConfigMap (D48). Every workload lists
  # this Secret after the ConfigMap in `envFrom`, so the value here wins over the empty one there.
  R2_ENDPOINT: ""
