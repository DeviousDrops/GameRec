# The tracked example. The real Secret is never committed (requirement 6) -- create it directly:
#
#   kubectl -n gamerec create secret generic gamerec-secrets --from-literal=GROQ_API_KEY=<key>
#
# It lives in manual/ so that `kubectl apply -f deploy/k8s/` cannot overwrite a real key with this
# empty one. Everything referencing it marks it optional: without a key the service answers
# normally, it just does not narrate (D6).
apiVersion: v1
kind: Secret
metadata:
  name: gamerec-secrets
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
type: Opaque
stringData:
  GROQ_API_KEY: ""
