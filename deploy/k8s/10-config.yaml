# Non-secret configuration, mirroring gamerec/config.py. Every value here is also a default in the
# code, so a missing key degrades to the documented default rather than to a crash (requirement 6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamerec-config
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
data:
  MINDB_ADDR: "mindb:50051"
  CORPUS_DIR: "/corpus"
  TOP_K: "5"
  MOOD_WEIGHT: "0.6"
  REVIEW_FLOOR: "50"
  # Groq decommissions models and the endpoint answers 404 for a name it no longer serves. Narration
  # fails open, so the only symptom is recommendations quietly arriving without any (D62). Check
  # against the account's own list rather than the docs:
  #   kubectl -n gamerec exec deploy/gamerec-api -- python -c 'import os,httpx;print([m["id"] for m in
  #     httpx.get("https://api.groq.com/openai/v1/models", headers={"Authorization":"Bearer "+os.environ["GROQ_API_KEY"]}).json()["data"]])'
  GROQ_MODEL: "openai/gpt-oss-20b"

  # Whether /health names the stack -- kernel, architecture, capacity, model -- on top of saying
  # whether it works. Off, because this API answers the open internet and that block is a free
  # fingerprint; an operator reads the same thing from inside the cluster. Flip it to "true" and
  # roll the API before running bench.latency, which refuses to label a run without it (D56).
  HEALTH_DETAIL: "false"

  # Ingest pacing (D17). Deliberately under Steam's measured ceiling: the penalty for guessing high
  # is a 429 and a 20-30s backoff, which makes the whole run slower than pacing correctly would.
  STEAM_REQUESTS_PER_MIN: "35"
  STEAM_BURST: "5"
  # New appids first, then refreshes up to this cap, so a big Steam change day cannot starve out the
  # new games users actually notice (D15).
  MAX_UPDATES_PER_RUN: "500"
  # How much work a crash can destroy, in batches of 200 (D7).
  SNAPSHOT_EVERY_BATCHES: "10"

  # Object storage (D20). Leave these empty and the ingest runs without a lease and says so, while
  # the backup sidecar refuses to start -- which is the right noise for a cluster taking no backups.
  # R2_ENDPOINT stays empty here on purpose and is set in the Secret instead (D48): it embeds the
  # Cloudflare account id, and a value patched into this ConfigMap by hand would be reset to empty by
  # the next `kubectl apply -f deploy/k8s/`, silently stopping backups.
  R2_ENDPOINT: ""
  # Exact, and worth checking against the R2 dashboard rather than from memory: a near miss
  # answers NoSuchBucket on the first PutObject, which reads like an outage rather than a typo.
  R2_BUCKET: "gamerec"
  # Comfortably longer than a batch takes at 35 requests a minute, so a run renews long before it
  # expires; short enough that a pod killed mid-run does not block tomorrow night (D17).
  INGEST_LEASE_TTL: "1800"
