[pytest]
# `pytest -q` and `python -m pytest -q` have to behave the same. The second puts the working
# directory on sys.path and the first does not, so without this line every `from gamerec...` import
# fails to collect under the console script -- which is the form the README documents and CI runs.
# The tests job was red from the day the workflow landed, while `python -m pytest` passed locally.
pythonpath = .

# Only tests/ holds tests. bench/ is a runnable tool, not a suite, and nothing under it should be
# collected because a module named latency.py sits next to a function named percentile.
testpaths = tests
