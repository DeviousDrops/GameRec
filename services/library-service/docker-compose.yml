# Local development: the service and its database.
#
#   docker compose up --build
#   curl -X PUT localhost:8080/api/v1/users/me/library/413150 \
#        -H 'content-type: application/json' -d '{"status":"OWNED"}'
#
# Swagger UI is at http://localhost:8080/swagger-ui.html.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      # A development default for a throwaway local database. Real credentials come from the
      # Kubernetes Secret, never from this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "library", "-d", "library"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/library
      DB_USER: library
      DB_PASSWORD: ${POSTGRES_PASSWORD:-library-dev}
    ports:
      - "8080:8080"
    # Wait for the healthcheck, not just for the container to start: Flyway runs at boot and needs a
    # database that is accepting connections.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
