# library-service manifests. Plain YAML applied with kubectl, like the rest of GameRec:
#
#   kubectl apply -f services/library-service/k8s/manual/secret.template.yaml   # edited first
#   kubectl apply -f services/library-service/k8s/
#
# Everything goes in the gamerec namespace (deploy/k8s/00-namespace.yaml creates it), so the
# recommender reaches this service as http://library-service:8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-service-config
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
data:
  # The headless Service in 20-postgres.yaml. Not a secret, so it lives here; the credentials
  # live in the Secret.
  DB_URL: "jdbc:postgresql://library-postgres:5432/library"
