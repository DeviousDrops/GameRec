# Postgres for library-service: a StatefulSet of one, with its own volume.
#
# A StatefulSet rather than a Deployment because it gives the pod a stable name (library-postgres-0)
# and a volume claim that belongs to that name: if the pod is deleted, its replacement gets the same
# volume back. One replica, because Postgres has a single writer; replication is a different project.

# Headless (clusterIP: None): DNS for library-postgres resolves straight to the pod's IP. A StatefulSet
# requires one, and with a single pod it is also the address the service connects to.
apiVersion: v1
kind: Service
metadata:
  name: library-postgres
  namespace: gamerec
  labels:
    app.kubernetes.io/name: library-postgres
    app.kubernetes.io/part-of: gamerec
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: library-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: library-postgres
  namespace: gamerec
  labels:
    app.kubernetes.io/name: library-postgres
    app.kubernetes.io/part-of: gamerec
spec:
  serviceName: library-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: library-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-postgres
        app.kubernetes.io/part-of: gamerec
    spec:
      # Time for Postgres to finish a checkpoint on SIGTERM instead of recovering from a crash.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Pinned to a minor version, so a restart never upgrades the database by surprise.
          image: postgres:17.11-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: library
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: library-service-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-service-secrets
                  key: DB_PASSWORD
            # A subdirectory of the volume rather than its root: initdb refuses a directory that is
            # not empty, and some storage puts a lost+found at the root of every volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_isready only asks whether the server accepts connections; it needs no password.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d library"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d library"]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # One claim per pod, created from this template and kept when the pod goes away.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # k3s's built-in provisioner: a directory on the node. Fine for one node; the data is only
        # as safe as that node's disk.
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
