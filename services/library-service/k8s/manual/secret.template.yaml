# The database credentials. In manual/ so that `kubectl apply -f k8s/`, which is not recursive,
# can never overwrite a real Secret with these placeholders -- the same arrangement as GameRec's own
# deploy/k8s/manual/secret.template.yaml. Real values never go in the repo.
#
# Create it without writing the password anywhere, in a form that keeps it out of shell history:
#
#   read -rsp "library DB password: " PW; echo
#   kubectl -n gamerec create secret generic library-service-secrets \
#     --from-literal=DB_USER=library --from-env-file=<(printf 'DB_PASSWORD=%s\n' "$PW")
#   unset PW
#
# One Secret feeds both sides: Postgres creates its user from these values on first boot, and the
# service logs in with the same ones, so the two cannot drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: library-service-secrets
  namespace: gamerec
  labels:
    app.kubernetes.io/part-of: gamerec
type: Opaque
stringData:
  DB_USER: "library"
  DB_PASSWORD: "change-me"
