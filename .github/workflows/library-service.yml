# library-service: tests on every change to it, and a multi-arch image on a library-service-v* tag.
# Separate from ci.yml and release.yml because it is a separate service with its own version, and a
# change to the Python code should not rebuild a Java image or the other way round.
name: library-service

on:
  push:
    branches: ["**"]
    # Path filters are not applied to tag pushes, so a release tag always runs.
    tags: ["library-service-v*"]
    paths:
      - "services/library-service/**"
      - ".github/workflows/library-service.yml"
  pull_request:
    paths:
      - "services/library-service/**"
      - ".github/workflows/library-service.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: services/library-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # QEMU runs the arm64 leg of the runtime stage; the Dockerfile builds the jar natively.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/deviousdrops/library-service
          # library-service-v0.1.0 publishes 0.1.0. No latest, for the reason in release.yml.
          flavor: latest=false
          tags: |
            type=match,pattern=library-service-v(.*),group=1

      # Built for both platforms on every run, so a Dockerfile that stops building for arm64 is
      # caught on the pull request; pushed only for a tag.
      - uses: docker/build-push-action@v6
        with:
          context: services/library-service
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=library-service
          cache-to: type=gha,mode=max,scope=library-service
