# Tests on every push and pull request. Nothing here publishes anything: the image is built to prove
# the Dockerfile still works, and release.yml is what pushes it.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # MinDB is consumed as a released image, never built here (D19, D28). The codec test needs a
      # real server because the whole point of it is that FlatBuffers-over-gRPC agrees end to end --
      # a mock would only prove the mock agrees with itself.
      - name: Start MinDB
        run: |
          docker run -d --name mindb -p 50051:50051 -p 50052:50052 \
            ghcr.io/deviousdrops/mindb:v0.1.0 \
            -addr=:50051 -dims=384 -capacity=5000 -snapshot=/tmp/ci.snap
          for i in $(seq 1 30); do
            nc -z localhost 50051 && break
            sleep 1
          done

      - name: Tests
        env:
          MINDB_ADDR: 127.0.0.1:50051
        run: pytest -q

      - name: MinDB logs on failure
        if: failure()
        run: docker logs mindb

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The operational scripts are the least-run code in the repo -- bootstrap.sh runs once per VM,
      # the TLS hook every 60 days -- so a typo in one surfaces at the worst possible moment. Nothing
      # here executes them; shellcheck reads them. It ships with the runner image.
      - name: shellcheck
        run: shellcheck deploy/vm/*.sh

      # They are documented as `./deploy/vm/bootstrap.sh`, which only works if git recorded the mode.
      - name: The scripts are executable
        run: |
          for script in deploy/vm/*.sh; do
            test -x "${script}" || { echo "${script} is not executable"; exit 1; }
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Build only, no push and no registry credentials. A Dockerfile that stopped building would
      # otherwise be found at release time, which is the worst moment to find it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          # The model download makes this the slow step, so the layer cache is worth wiring up.
          cache-from: type=gha
          cache-to: type=gha,mode=max
