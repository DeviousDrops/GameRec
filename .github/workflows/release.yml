# Publishes ghcr.io/deviousdrops/gamerec-api on a version tag. Tags only: an image that deploys is an
# image someone chose to cut, not whatever landed on a branch (D19 makes the same argument for MinDB).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Multi-arch because the dev boxes are amd64 and the VM is arm64 (D23). One tag that runs in
      # both places is what keeps "it worked locally" meaningful.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/deviousdrops/gamerec-api
          # v0.2.0 publishes 0.2.0 and 0.2. No `latest`: a manifest that says latest is a manifest
          # that cannot say what it deployed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
